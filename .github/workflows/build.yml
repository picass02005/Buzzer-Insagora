name: Build backend executables

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # IMPORTANT: ensure backend is on PYTHONPATH
      - name: Build backend with PyInstaller
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pyinstaller \
            --onefile \
            --name buzzer-backend \
            backend/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buzzer-backend-${{ matrix.os }}
          path: dist/
